<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Programming Learning System</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.login-container {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 350px;
    text-align: center;
}
h1 { color: #A389D4; margin-bottom: 15px; }
input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    width: 95%;
    padding: 10px;
    background-color: #A389D4;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}
button:hover { background-color: #8e74c1; }
</style>
</head>
<body>
<div class="login-container">
    <h1>Welcome</h1>
    <p>Enter your username to continue</p>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="login()">Login</button>
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>
<script>
function login() {
    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;
    if(username === "" || password === "") { alert("Please enter both username and password"); return; }
    var storedPass = localStorage.getItem(username);
    if(storedPass === null) { alert("No account found. Please sign up first."); return; }
    if(storedPass !== password) { alert("Incorrect password"); return; }
    localStorage.setItem("username", username);
    window.location.href = "dashboard.html";
}
</script>
</body>
</html>
